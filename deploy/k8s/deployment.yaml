apiVersion: apps/v1
kind: Deployment
metadata:
  name: dnsmon
  labels:
    app: dnsmon
spec:
  replicas: 2
  selector:
    matchLabels:
      app: dnsmon
  template:
    metadata:
      labels:
        app: dnsmon
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/metrics"
        prometheus.io/port: "8080"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
      containers:
        - name: dnsmon
          image: ghcr.io/t0mer/dnsmon:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: DNSMON_SERVER_LISTEN
              value: ":8080"
            - name: DNSMON_LOG_FORMAT
              value: "json"
            - name: DNSMON_STORAGE_DRIVER
              value: "sqlite"
            - name: DNSMON_STORAGE_DSN
              value: "file:/data/dnsmon.db?cache=shared&_fk=1"
            - name: DNSMON_CACHE_DRIVER
              value: "memory"
          resources:
            requests:
              cpu: "100m"
              memory: "64Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/v1/readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          volumeMounts:
            - name: data
              mountPath: /data
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
      volumes:
        - name: data
          emptyDir: {}
