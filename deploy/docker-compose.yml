version: "3.9"
# Set POSTGRES_PASSWORD before running:
#   export POSTGRES_PASSWORD=$(openssl rand -base64 32)
# or create a deploy/.env file (never commit it):
#   POSTGRES_PASSWORD=<your-strong-password>
services:
  dnsmon:
    image: ghcr.io/t0mer/dnsmon:latest
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    ports:
      - "8080:8080"
    environment:
      DNSMON_SERVER_LISTEN: ":8080"
      DNSMON_STORAGE_DRIVER: "postgres"
      DNSMON_STORAGE_DSN: "postgres://dnsmon:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/dnsmon?sslmode=require"
      DNSMON_CACHE_DRIVER: "redis"
      DNSMON_CACHE_REDIS_ADDR: "redis:6379"
      DNSMON_LOG_FORMAT: "json"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: dnsmon
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: dnsmon
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dnsmon"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
