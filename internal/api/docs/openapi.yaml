openapi: 3.1.0
info:
  title: dnsmon API
  description: Self-hosted DNS propagation checker API
  version: 1.0.0
  license:
    name: MIT

servers:
  - url: /api/v1
    description: API v1

security: []

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: API key

  schemas:
    SessionStatus:
      type: object
      properties:
        enabled:
          type: boolean
          description: Whether UI authentication is enabled.
        authenticated:
          type: boolean
        username:
          type: string

    NotificationChannel:
      type: object
      properties:
        id:
          type: string
        type:
          type: string
          enum: [shoutrrr, greenapi, gowa]
        name:
          type: string
        enabled:
          type: boolean
        config:
          type: object
          additionalProperties:
            type: string

    SettingsView:
      type: object
      properties:
        auth:
          type: object
          properties:
            enabled:
              type: boolean
            username:
              type: string
            password_set:
              type: boolean
        notifications:
          type: array
          items:
            $ref: '#/components/schemas/NotificationChannel'
        disabled_resolvers:
          type: array
          items:
            type: string

    SettingsUpdate:
      type: object
      properties:
        auth:
          type: object
          properties:
            enabled:
              type: boolean
            username:
              type: string
            password:
              type: string
              description: Set to change the admin password; omit or leave empty to keep the current one.
        notifications:
          type: array
          items:
            $ref: '#/components/schemas/NotificationChannel'
        disabled_resolvers:
          type: array
          items:
            type: string

    APIToken:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        prefix:
          type: string
        created_at:
          type: string
          format: date-time
        last_used_at:
          type: string
          format: date-time
          nullable: true

    ScheduleInput:
      type: object
      required: [name, cron]
      properties:
        name:
          type: string
        cron:
          type: string
          description: A cron macro (@hourly, @daily, @weekly, @monthly, @yearly), an @every duration, or a 5/6-field cron expression.
          example: "@daily"
        enabled:
          type: boolean

    Schedule:
      allOf:
        - $ref: '#/components/schemas/ScheduleInput'
        - type: object
          properties:
            id:
              type: string
            created_at:
              type: string
              format: date-time
            updated_at:
              type: string
              format: date-time

    Answer:
      type: object
      properties:
        name:
          type: string
        type:
          type: string
        ttl:
          type: integer
          format: int32
        value:
          type: string

    Resolver:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        ip:
          type: string
        port:
          type: integer
        protocol:
          type: string
          enum: [udp, tcp, dot, doh]
        country:
          type: string
        city:
          type: string
        lat:
          type: number
          format: double
        lng:
          type: number
          format: double
        asn:
          type: integer
          format: int64
        isp:
          type: string

    ResolverResult:
      type: object
      properties:
        resolver:
          $ref: '#/components/schemas/Resolver'
        status:
          type: string
          enum: [ok, nxdomain, timeout, servfail, refused, error]
        answers:
          type: array
          items:
            $ref: '#/components/schemas/Answer'
        authority:
          type: array
          items:
            $ref: '#/components/schemas/Answer'
        additional:
          type: array
          items:
            $ref: '#/components/schemas/Answer'
        dnssec:
          type: boolean
          nullable: true
        duration_ms:
          type: integer
          format: int64
        error:
          type: string
        queried_at:
          type: string
          format: date-time

    CheckSummary:
      type: object
      properties:
        total_resolvers:
          type: integer
        responded:
          type: integer
        nxdomain:
          type: integer
        timeouts:
          type: integer
        errors:
          type: integer
        unique_answer_sets:
          type: integer
        consensus:
          type: object
          additionalProperties:
            type: integer

    Check:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        type:
          type: string
        created_at:
          type: string
          format: date-time
        results:
          type: array
          items:
            $ref: '#/components/schemas/ResolverResult'
        summary:
          $ref: '#/components/schemas/CheckSummary'

    ErrorDetail:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
        details:
          type: object

    ErrorResponse:
      type: object
      properties:
        error:
          $ref: '#/components/schemas/ErrorDetail'
        request_id:
          type: string

    VersionInfo:
      type: object
      properties:
        version:
          type: string
        commit:
          type: string
        date:
          type: string

    RecordType:
      type: object
      properties:
        name:
          type: string
        description:
          type: string

paths:
  /health:
    get:
      summary: Liveness check
      operationId: getHealth
      tags: [Health]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string

  /readyz:
    get:
      summary: Readiness check
      operationId: getReadyz
      tags: [Health]
      responses:
        '200':
          description: Ready
        '503':
          description: Not ready

  /version:
    get:
      summary: Build version info
      operationId: getVersion
      tags: [Health]
      responses:
        '200':
          description: Version info
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VersionInfo'

  /resolvers:
    get:
      summary: List all resolvers
      operationId: listResolvers
      tags: [Resolvers]
      parameters:
        - name: country
          in: query
          schema:
            type: string
          description: Filter by ISO-3166 alpha-2 country code(s), comma-separated
        - name: q
          in: query
          schema:
            type: string
          description: Free-text search
      responses:
        '200':
          description: List of resolvers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Resolver'

  /resolvers/{id}:
    get:
      summary: Get a resolver by ID
      operationId: getResolver
      tags: [Resolvers]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Resolver found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Resolver'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /record-types:
    get:
      summary: List supported record types
      operationId: listRecordTypes
      tags: [Discovery]
      responses:
        '200':
          description: List of record types
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RecordType'

  /check:
    post:
      summary: Run a DNS propagation check
      operationId: postCheck
      tags: [Check]
      security:
        - {}
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, type]
              properties:
                name:
                  type: string
                  description: Domain name to check
                type:
                  type: string
                  description: DNS record type
                resolvers:
                  type: array
                  items:
                    type: string
                  description: Resolver IDs to use (empty = all)
                custom_resolvers:
                  type: array
                  items:
                    $ref: '#/components/schemas/Resolver'
                save:
                  type: boolean
                  description: Persist the check for later retrieval
      responses:
        '200':
          description: Check completed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Check'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /check/stream:
    get:
      summary: Stream DNS propagation check results via WebSocket
      operationId: streamCheck
      tags: [Check]
      description: |
        Upgrade to WebSocket. Send a JSON frame: `{"name":"...","type":"A","resolvers":[]}`.
        Receive result frames: `{"type":"result","data":<ResolverResult>}`.
        Final frame: `{"type":"done","data":{"summary":<CheckSummary>,"id":"..."}}`.
      responses:
        '101':
          description: Switching Protocols (WebSocket)

  /check/{id}:
    get:
      summary: Retrieve a saved check by ID
      operationId: getCheck
      tags: [Check]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Check found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Check'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /check/{id}/export:
    get:
      summary: Export a check result
      operationId: exportCheck
      tags: [Check]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: format
          in: query
          schema:
            type: string
            enum: [json, csv, png, svg, pdf]
            default: json
      responses:
        '200':
          description: Export file
          content:
            application/json: {}
            text/csv: {}
            image/png: {}
            image/svg+xml: {}
            application/pdf: {}
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /lookup:
    post:
      summary: Perform a detailed single-resolver DNS lookup
      operationId: postLookup
      tags: [Lookup]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, type]
              properties:
                name:
                  type: string
                type:
                  type: string
                resolver:
                  type: string
                  description: Resolver IP or resolver ID
                protocol:
                  type: string
                  enum: [udp, tcp, dot, doh]
      responses:
        '200':
          description: Lookup result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResolverResult'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /reverse:
    post:
      summary: Perform a reverse DNS (PTR) propagation check
      operationId: postReverse
      tags: [Reverse]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ip]
              properties:
                ip:
                  type: string
                  description: IPv4 or IPv6 address
                resolvers:
                  type: array
                  items:
                    type: string
      responses:
        '200':
          description: PTR check result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Check'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /history:
    get:
      summary: List recent checks
      operationId: listHistory
      tags: [History]
      security:
        - bearerAuth: []
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        '200':
          description: List of checks
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Check'

  /history/{id}:
    delete:
      summary: Delete a saved check
      operationId: deleteHistory
      tags: [History]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Deleted
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/login:
    post:
      summary: Sign in to the UI
      description: Verifies the admin credentials (when auth is enabled) and sets an HttpOnly session cookie.
      operationId: login
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username:
                  type: string
                password:
                  type: string
      responses:
        '200':
          description: Authenticated; session cookie set
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionStatus'
        '401':
          description: Invalid username or password
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/logout:
    post:
      summary: Sign out
      operationId: logout
      tags: [Auth]
      responses:
        '200':
          description: Session cookie cleared
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionStatus'

  /auth/session:
    get:
      summary: Current session status
      operationId: authSession
      tags: [Auth]
      responses:
        '200':
          description: Whether auth is enabled and whether the caller is authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionStatus'

  /settings:
    get:
      summary: Get application settings
      description: Returns settings with secrets redacted (the admin password is never returned; only whether one is set).
      operationId: getSettings
      tags: [Settings]
      responses:
        '200':
          description: Current settings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SettingsView'
    put:
      summary: Update application settings
      description: Updates auth (optional UI login), notification channels, and the set of disabled resolver IDs. Provide `auth.password` only to change it.
      operationId: updateSettings
      tags: [Settings]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SettingsUpdate'
      responses:
        '200':
          description: Updated settings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SettingsView'
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /settings/notifications/test:
    post:
      summary: Send a test notification to a channel
      description: Delivers a test message using the channel in the request body (not necessarily a saved channel).
      operationId: testNotification
      tags: [Settings]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NotificationChannel'
      responses:
        '200':
          description: Test message sent
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: sent
        '400':
          description: Invalid channel
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '502':
          description: Delivery failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /settings/tokens:
    get:
      summary: List API tokens
      operationId: listTokens
      tags: [Settings]
      responses:
        '200':
          description: API tokens (without secrets)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/APIToken'
    post:
      summary: Create an API token
      description: Returns the raw token once; only its hash is stored.
      operationId: createToken
      tags: [Settings]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
      responses:
        '201':
          description: Created token (raw secret included once)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/APIToken'
                  - type: object
                    properties:
                      token:
                        type: string

  /settings/tokens/{id}:
    delete:
      summary: Revoke an API token
      operationId: deleteToken
      tags: [Settings]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Deleted
        '404':
          description: Not found

  /settings/schedules:
    get:
      summary: List monitoring schedules
      operationId: listSchedules
      tags: [Settings]
      responses:
        '200':
          description: Schedules
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Schedule'
    post:
      summary: Create a monitoring schedule
      operationId: createSchedule
      tags: [Settings]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScheduleInput'
      responses:
        '201':
          description: Created schedule
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Schedule'

  /settings/schedules/{id}:
    put:
      summary: Update a monitoring schedule
      operationId: updateSchedule
      tags: [Settings]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScheduleInput'
      responses:
        '200':
          description: Updated schedule
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Schedule'
        '404':
          description: Not found
    delete:
      summary: Delete a monitoring schedule
      operationId: deleteSchedule
      tags: [Settings]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Deleted
        '404':
          description: Not found
